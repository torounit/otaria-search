name: Release
on:
    release:
        types: [published]

jobs:
    # Catches a release created by hand, or a draft whose tag was edited.
    check-version:
        name: Check Version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Check the tag matches the versions in the files
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: bin/check-version.sh "$TAG"

    lint:
        name: Lint
        needs: check-version
        uses: ./.github/workflows/lint.yml

    test:
        name: Test
        needs: check-version
        uses: ./.github/workflows/test.yml

    plugin-check:
        name: Plugin Check
        needs: check-version
        uses: ./.github/workflows/plugin-check.yml
        permissions:
            contents: read
            pull-requests: write

    release:
        name: Upload Release Asset
        needs: [check-version, lint, test, plugin-check]
        runs-on: ubuntu-latest
        permissions:
            attestations: write
            id-token: write
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            # Until the plugin is approved on WordPress.org, its SVN repository does not exist
            # and the deploy action cannot even check it out (dry-run included). Build the
            # zip the same way instead: the files .distignore does not list, in a otaria-search/
            # directory. Set the WPORG_DEPLOY repository variable to "true" to deploy.
            - name: Build plugin zip
              if: vars.WPORG_DEPLOY != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/otaria-search"
                  rsync -rc --exclude-from=.distignore ./ "$RUNNER_TEMP/otaria-search/"
                  (cd "$RUNNER_TEMP" && zip -r "$GITHUB_WORKSPACE/otaria-search.zip" otaria-search)

            - name: WordPress Plugin Deploy
              if: vars.WPORG_DEPLOY == 'true'
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: otaria-search

            - name: Upload release asset
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.workspace }}/otaria-search.zip
