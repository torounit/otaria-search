name: Plugin Check
on:
    pull_request:
        # README.md is the WordPress.org readme, which Plugin Check validates.
        paths:
            - '**'
            - '!**.md'
            - 'README.md'
    push:
        branches: [main]
        paths:
            - '**'
            - '!**.md'
            - 'README.md'
    workflow_call:

permissions:
    contents: read
    # The action posts the results as a pull request comment.
    pull-requests: write

jobs:
    plugin-check:
        name: Plugin Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            # Plugin Check does not read .distignore, so check what ships, as release.yml builds it.
            - name: Build the distributed plugin
              run: |
                  mkdir -p "$RUNNER_TEMP/otaria-search"
                  rsync -rc --exclude-from=.distignore ./ "$RUNNER_TEMP/otaria-search/"

            # The action writes its own .wp-env.json. Releases after v1.1.9 merge into an existing
            # one instead, which would load "." and the development plugins too.
            - name: Remove the wp-env config
              run: rm .wp-env.json

            # build/ is generated by @wordpress/build, which we cannot fix from here.
            # trunk, as the action offers no other choice that meets Requires at least: 7.2 until
            # it is released: its "latest" is the latest stable version.
            - name: Run Plugin Check
              uses: WordPress/plugin-check-action@v1
              with:
                  build-dir: ${{ runner.temp }}/otaria-search
                  exclude-directories: build
                  wp-version: trunk
