name: Plugin Check
on:
    pull_request:
        # README.md is the WordPress.org readme, which Plugin Check validates.
        paths:
            - '**'
            - '!**.md'
            - 'README.md'
    push:
        branches: [main]
        paths:
            - '**'
            - '!**.md'
            - 'README.md'
    workflow_call:

permissions:
    contents: read
    # The action posts the results as a pull request comment.
    pull-requests: write

jobs:
    plugin-check:
        name: Plugin Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            # Plugin Check does not read .distignore, so check what ships, as release.yml builds it.
            - name: Build the distributed plugin
              run: |
                  mkdir -p "$RUNNER_TEMP/otaria-search"
                  rsync -rc --exclude-from=.distignore ./ "$RUNNER_TEMP/otaria-search/"

            # The action merges its settings into .wp-env.json. Keep only the versions: "." and the
            # development plugins would otherwise load too, over the plugin being checked.
            - name: Reduce the wp-env config to the versions
              run: |
                  jq '{core, phpVersion, testsEnvironment}' .wp-env.json > "$RUNNER_TEMP/wp-env.json"
                  mv "$RUNNER_TEMP/wp-env.json" .wp-env.json

            # build/ is generated by @wordpress/build, which we cannot fix from here.
            # WordPress comes from "core" in .wp-env.json, as wp-version stays at its default.
            - name: Run Plugin Check
              uses: WordPress/plugin-check-action@v1
              with:
                  build-dir: ${{ runner.temp }}/otaria-search
                  exclude-directories: build
